<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>GIF 裁剪技术验证</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;background:#f5f6f8;color:#18212d;margin:0}main{max-width:1100px;margin:32px auto;padding:0 20px}section{background:white;border:1px solid #d9dfe7;border-radius:8px;padding:20px;margin:18px 0}h1{font-size:26px}h2{font-size:19px}label{display:inline-flex;gap:8px;align-items:center;margin:8px 12px 8px 0}input[type=number]{width:85px}select{max-width:100%}input,button,select{font:inherit;padding:8px}button{cursor:pointer}button:disabled{cursor:wait}#views{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.preview{min-height:160px;padding:12px;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0/20px 20px;overflow:auto}.preview img{max-width:100%;image-rendering:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#status{min-height:28px}a{color:#174ac0}.note{color:#596575;font-size:14px}
*{box-sizing:border-box}label{max-width:100%;min-width:0}select{min-width:0;flex:1}input[type=file]{max-width:100%;min-width:0}section{min-width:0;overflow-wrap:anywhere}#log{max-height:360px;overflow:auto}.preview img:not([src]){visibility:hidden}@media(max-width:600px){section:first-of-type label{display:flex;width:100%}#views{grid-template-columns:1fr}main{margin:16px auto;padding:0 12px}section{padding:14px}button{margin:4px 0}label{flex-wrap:wrap}}
</style></head><body><main>
<h1>GIF 裁剪技术验证</h1><p>本地 A/B 实验页 · 文件不上传外网 · 坐标均为原图像素</p>
<section><h2>1. 选择测试文件</h2><label>样本<select id="samples"><option value="">请选择</option></select></label><label>或本地文件<input id="file" type="file" accept="image/gif,.gif"></label><p id="info">尚未加载</p></section>
<section><h2>2. 固定选区</h2><label>X<input id="x" type="number" min="0" value="0"></label><label>Y<input id="y" type="number" min="0" value="0"></label><label>宽<input id="width" type="number" min="1" value="1"></label><label>高<input id="height" type="number" min="1" value="1"></label><p><label>B 配置<select id="b-mode"><option value="W198" disabled>Gifsicle 1.98 WASM（待构建，已暂停）</option><option value="B-strict" selected>严格警告（B-strict）</option><option value="B">默认容错（B，基线）</option><option value="B-U-strict">先还原帧（B-U-strict，仅实验）</option></select></label></p><p><button id="full">全图</button> <button id="center">中间矩形</button> <button id="a">运行 A · gifuct-js + gifenc</button> <button id="b">运行 B · Gifsicle WASM</button></p><p id="status" role="status">等待文件</p><p class="note">此页用于处理引擎验证，不包含正式产品的拖动裁剪框。失败后可重新选文件；每任务超时 60 秒。</p></section>
<section><h2>3. 预览与下载</h2><div id="views"><div><h3>原图</h3><div class="preview"><img id="original" alt="原始 GIF"></div></div><div><h3>方案 A</h3><div class="preview"><img id="out-a" alt="方案 A 结果"></div><a id="download-a" hidden>下载 A</a></div><div><h3>方案 B</h3><div class="preview"><img id="out-b" alt="方案 B 结果"></div><a id="download-b" hidden>下载 B</a></div></div></section>
<section><h2>4. 本次日志</h2><button id="logs">下载 JSON 日志</button><pre id="log">[]</pre><p class="note">预览不代表逐帧验证通过；自动对比报告由 scripts/verify.py 生成。内存未测，手机及 Safari 需另行实测。</p></section>
</main><script type="module" src="/src/main.js"></script></body></html>
